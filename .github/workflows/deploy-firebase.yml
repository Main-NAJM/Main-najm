name: نشر على Firebase Hosting

on:
  push:
    # يُتابَع الدفع إلى كل الفروع، والنشر محصور في الفرع الرئيسي بشرط الوظيفة أدناه.
    # السبب: اسم الفرع الرئيسي يُقرأ وقت التشغيل، فلا يتوقّف النشر بصمت إن تغيّر
    # الفرع الافتراضي للمستودع أو أُعيدت تسميته.
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    name: بناء ونشر
    runs-on: ubuntu-latest
    # لا يُنشر إلا الفرع الرئيسي — main أو الفرع الافتراضي للمستودع أيًّا كان اسمه — أو تشغيل يدوي.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch }}
    permissions:
      contents: read
      # تلزم للمصادقة بلا مفتاح: GitHub يوقّع هوية التشغيل، وGoogle يتحقّق منها.
      id-token: write
    steps:
      - name: جلب الشيفرة
        uses: actions/checkout@v4

      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: فحص الأنواع
        run: npm run lint

      # قواعد الأمان هي الشيء الوحيد الذي يفصل بيانات زبون عن زبون، وخطأ حرف
      # فيها لا يكسر بناء ولا يظهر في أي شاشة. تُفحص قبل النشر لا بعده.
      # المحاكي لا يحتاج اعتمادات، فالخطوة تعمل حتى على المستودعات المستنسخة.
      - name: فحص قواعد أمان Firestore
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project demo-rules-check "npm run --silent test:rules"

      # معرّف المشروع ليس سرا: يؤخذ من متغير المستودع إن وجد، وإلا من .firebaserc
      - name: تحديد مشروع Firebase
        id: project
        env:
          VAR_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          project="$VAR_PROJECT"
          if [ -z "$project" ] && [ -f .firebaserc ]; then
            project="$(python3 -c "import json;print(json.load(open('.firebaserc'))['projects']['default'])")"
          fi
          if [ -z "$project" ]; then
            echo "::error::تعذر تحديد المشروع. أضف .firebaserc أو متغير المستودع FIREBASE_PROJECT_ID"
            exit 1
          fi
          echo "المشروع: $project"
          echo "id=$project" >> "$GITHUB_OUTPUT"

      # الطريق المفضّل: مصادقة بلا مفتاح. GitHub يوقّع هوية هذا التشغيل، وGoogle
      # يقبلها من هذا المستودع وحده، فلا يوجد مفتاح دائم يُسرَّب أو تنتهي صلاحيته.
      # وهو الطريق الوحيد حين تمنع سياسة المؤسسة إنشاء مفاتيح لحسابات الخدمة.
      # يُفعَّل تلقائيا متى ضُبط متغيّرا المستودع؛ انظر scripts/setup-workload-identity.sh
      - name: مصادقة Google بلا مفتاح
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # الطريق البديل حين لا تُضبط المصادقة بلا مفتاح: مفتاح في سرّ المستودع.
      # المفتاح يكتب في ملف خارج مساحة العمل ولا يطبع أبدا.
      - name: تجهيز مفتاح حساب الخدمة
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::لا توجد اعتمادات. الطريق المفضّل بلا مفتاح: شغّل scripts/setup-workload-identity.sh مرة واحدة في Google Cloud Shell ثم أضف المتغيّرين اللذين يطبعهما. البديل: سرّ باسم FIREBASE_SERVICE_ACCOUNT قيمته ملف JSON كامل لحساب خدمة."
            exit 1
          fi
          key_file="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$SA" > "$key_file"
          if ! python3 -c "import json,sys;d=json.load(open(sys.argv[1]));sys.exit(0 if d.get('type')=='service_account' and d.get('project_id') else 1)" "$key_file"; then
            rm -f "$key_file"
            echo "::error::السر FIREBASE_SERVICE_ACCOUNT موجود لكن محتواه ليس ملف حساب خدمة. القيمة الصحيحة ملف JSON كامل يبدأ بـ {\"type\": \"service_account\"."
            exit 1
          fi
          echo "مفتاح حساب الخدمة صالح."
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key_file" >> "$GITHUB_ENV"

      # مفاتيح الويب ليست أسرارا (تشحن داخل الشيفرة على أي حال)، فتجلب من
      # المشروع نفسه بدل أن يضيفها المستخدم يدويا ستة أسرار.
      # الاعتمادات تصل من خطوة المصادقة أيًّا كان طريقها، عبر بيئة الوظيفة.
      - name: جلب مفاتيح تطبيق الويب وكتابة .env.local
        run: node scripts/firebase-setup.mjs --force

      - name: بناء نسخة الإنتاج
        run: npm run build

      - name: النشر على Firebase
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project "${{ steps.project.outputs.id }}" --non-interactive
