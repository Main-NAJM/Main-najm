name: نشر على Firebase Hosting

on:
  push:
    branches: [main]
  # يسمح بتشغيل النشر يدوياً من تبويب Actions.
  workflow_dispatch:

permissions:
  contents: read

# نشر واحد في كل مرة.
concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    name: بناء ونشر
    runs-on: ubuntu-latest
    # لا يعمل إلا إذا أُضيف مفتاح حساب الخدمة، فلا يفشل النشر على المستودعات المستنسخة.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: جلب الشيفرة
        uses: actions/checkout@v4

      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # معرّف المشروع ليس سرّاً: يُؤخذ من السرّ أو من متغيّر المستودع، وإلا من .firebaserc.
      - name: تحديد مشروع Firebase
        id: project
        env:
          SECRET_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          VAR_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          project="$SECRET_PROJECT"
          [ -z "$project" ] && project="$VAR_PROJECT"
          if [ -z "$project" ] && [ -f .firebaserc ]; then
            project="$(python3 -c "import json;print(json.load(open('.firebaserc'))['projects']['default'])" 2>/dev/null || true)"
          fi
          if [ -z "$project" ]; then
            echo "::error::تعذّر تحديد المشروع — أضف .firebaserc أو السرّ FIREBASE_PROJECT_ID"
            exit 1
          fi
          echo "المشروع: $project"
          echo "id=$project" >> "$GITHUB_OUTPUT"

      # يُقبل المفتاح من أيّ من السرّين، والعبرة بالمحتوى لا بالاسم: أوّل قيمة تكون
      # ملف حساب خدمة صالحاً (‎"type": "service_account"‎) هي المعتمدة.
      - name: تجهيز مفتاح حساب الخدمة
        id: sa
        env:
          SA_PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_ALT: ${{ secrets.ALIMENIOM }}
          # أسماء الأسرار المتاحة فقط — لا قيمها — للتشخيص عند غياب المفتاح.
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          key_file="$RUNNER_TEMP/firebase-sa.json"
          found_but_invalid=""

          check() {
            printf '%s' "$1" > "$key_file"
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));sys.exit(0 if d.get('type')=='service_account' and d.get('project_id') else 1)" "$key_file" 2>/dev/null
          }

          for name in FIREBASE_SERVICE_ACCOUNT ALIMENIOM; do
            case "$name" in
              FIREBASE_SERVICE_ACCOUNT) value="$SA_PRIMARY" ;;
              ALIMENIOM) value="$SA_ALT" ;;
            esac
            [ -z "$value" ] && continue
            if check "$value"; then
              echo "مفتاح حساب الخدمة صالح، مأخوذ من السرّ: $name"
              echo "path=$key_file" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            found_but_invalid="$found_but_invalid $name"
          done

          rm -f "$key_file"
          echo "الأسرار المرئية لهذا التشغيل (الأسماء فقط):"
          printf '%s' "$ALL_SECRETS" | python3 -c "import json,sys;[print(' -',k) for k in sorted(json.load(sys.stdin))]"
          if [ -n "$found_but_invalid" ]; then
            echo "::error::السرّ$found_but_invalid موجود لكن محتواه ليس ملف حساب خدمة. القيمة الصحيحة هي محتوى ملف JSON كامل من Firebase ← Project settings ← Service accounts ← Generate new private key، يبدأ بـ {\"type\": \"service_account\"."
          else
            echo "::error::لا يوجد مفتاح حساب خدمة. أضف سرّاً باسم FIREBASE_SERVICE_ACCOUNT في تبويب Actions (لا Dependabot ولا Codespaces)، Repository secret لا Environment secret، في مستودع Main-NAJM/Main-najm نفسه."
          fi
          exit 1

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: فحص الأنواع
        run: npm run lint

      # مفاتيح الويب ليست أسراراً (تُشحن داخل الشيفرة على أي حال)، فتُجلب من المشروع
      # نفسه بمفتاح حساب الخدمة بدل أن يضيفها المستخدم يدوياً ستة أسرار.
      - name: جلب مفاتيح تطبيق الويب وكتابة .env.local
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.path }}
        run: node scripts/firebase-setup.mjs --force

      - name: بناء نسخة الإنتاج
        # استضافة Firebase تخدم التطبيق من الجذر، فلا يُضبط BASE_PATH.
        # المفاتيح تأتي من .env.local الذي كتبته الخطوة السابقة.
        run: npm run build

      - name: النشر على Firebase
        env:
          # المفتاح في ملف مؤقّت خارج مساحة العمل، ولا يُطبع أبداً.
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.path }}
          FIREBASE_PROJECT_ID: ${{ steps.project.outputs.id }}
        run: |
          npx --yes firebase-tools@13 deploy \
            --only hosting,firestore:rules \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
