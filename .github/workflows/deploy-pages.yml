name: النشر على GitHub Pages

# نشر بلا مفتاح حساب خدمة وبلا أي سرّ في المستودع: يبني Pages من الشيفرة مباشرة.
# مفيد حين تمنع سياسة Google Cloud إنشاء مفاتيح الخدمة التي يحتاجها نشر Firebase.

on:
  push:
    branches:
      - main
      - claude/herfah-pro-app-le726o
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نشرة واحدة في كل مرة، وتُلغى السابقة إن وصلت دفعة أحدث.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: البناء
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: تهيئة Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # يفعّل Pages على المستودع ويضبط مصدره على GitHub Actions إن لم يكن مفعّلاً،
          # فلا حاجة إلى ضبطه يدوياً من Settings.
          enablement: true

      - name: حساب مسار النشر
        run: |
          base="${{ steps.pages.outputs.base_path }}"
          # base_path يأتي فارغاً على النطاق المخصّص، وبلا شرطة أخيرة عادةً.
          case "$base" in
            ''|'/') base='/' ;;
            */) ;;
            *) base="$base/" ;;
          esac
          echo "BASE_PATH=$base"        >> "$GITHUB_ENV"
          echo "APP_BASE_PATH=${base}app/" >> "$GITHUB_ENV"
          echo "مسار النشر: $base"

      - name: تثبيت الحزم
        run: npm ci

      - name: مفاتيح الويب
        # من firebase.web.json المرفوع، أو من متغيّرات المستودع إن فُضّلت.
        # بلا مفاتيح يُبنى كل شيء ويعمل التطبيق في وضع الجهاز.
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: node scripts/web-config.mjs --force

      - name: البناء
        run: npm run build

      - name: تهيئة الملفات لـ Pages
        run: node scripts/pages-404.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: النشر
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: الروابط
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "### تمّ النشر" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${url} — حرفة برو" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${url}albacha/ — الموقع التعريفي" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${url}app/ — تطبيق مؤسسة الباشة" >> "$GITHUB_STEP_SUMMARY"
