    <script>
      // استعادة المسار بعد تحويلة 404.html على GitHub Pages (استضافة ملفات ساكنة
      // لا تعرف مسارات التطبيق). لا أثر لها على الاستضافات التي تعيد الكتابة بنفسها.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p === null) return;
        var q = params.get('q');
        var path = window.location.pathname.replace(/\/$/, '') + p;
        window.history.replaceState(null, '', path + (q ? '?' + q : '') + window.location.hash);
      })();
    </script>
